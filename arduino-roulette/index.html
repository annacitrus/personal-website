function choose(pool){const a=new Uint32Array(1);crypto.getRandomValues(a);return pool[Math.floor(a[0]/4294967296*pool.length)]}
function compatible(part,others){return !others.some(other=>other.resources.some(r=>part.resources.includes(r)))}
function tone(freq,duration=.045,vol=.025){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
async function spin(){if(spinning)return;spinning=true;$('#spin').disabled=true;$('#spin span').textContent='SPINNING…';$('#status').textContent='Choosing three parts.';const a=choose(inputs),b=choose(outputs.filter(p=>compatible(p,[a]))),c=choose([...inputs,...outputs].filter(p=>compatible(p,[a,b])));picks=[a,b,c];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const tick=setInterval(()=>tone(140+Math.random()*250),85);await Promise.all(picks.map((p,i)=>new Promise(resolve=>{const reel=$('#reel'+i),pool=i===0?inputs:i===1?outputs:[...inputs,...outputs];reel.classList.remove('land');const items=Array.from({length:18+i*3},()=>choose(pool));items.push(p);const strip=document.createElement('div');strip.innerHTML=items.map(cell).join('');strip.setAttribute('aria-hidden','true');reel.replaceChildren(strip);reel.classList.add('rolling');const height=reel.clientHeight;const anim=strip.animate([{transform:'translateY(0)'},{transform:`translateY(-${(items.length-1)*height}px)`}],{duration:reduced?80:1450+i*310,easing:'cubic-bezier(.12,.65,.14,1)',fill:'forwards'});anim.onfinish=()=>{reel.innerHTML=cell(p);reel.classList.remove('rolling');reel.classList.add('land');tone(400+i*170,.13,.06);resolve()}})));clearInterval(tick);spinning=false;$('#spin').disabled=false;$('#spin span').textContent='SPIN AGAIN';$('#status').textContent=picks.map(p=>p.name).join(', ')+'. Build a project using all three.';showPacks();if(!reduced)celebrate();}
function celebrate(){const root=$('#confetti');root.replaceChildren();for(let i=0;i<22;i++){const el=document.createElement('i');el.className='confetto';el.style.left=(15+Math.random()*70)+'%';el.style.background=['#ff5b25','#71876a','#c5c95b'][i%3];el.style.animationDelay=Math.random()*.15+'s';root.append(el)}setTimeout(()=>root.replaceChildren(),1500)}
$('#spin').addEventListener('click',spin);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT','TEXTAREA','SUMMARY','A'].includes(document.activeElement.tagName)){e.preventDefault();spin()}});
$('#sound').addEventListener('click',()=>{sound=!sound;$('#sound').setAttribute('aria-label',sound?'Turn sound off':'Turn sound on');$('#sound').setAttribute('aria-pressed',String(sound));if(sound)tone(550,.1)});
$('#film').addEventListener('click',()=>{const on=document.body.classList.toggle('film');$('#film').setAttribute('aria-label',on?'Exit Reel mode':'Reel mode');$('#film').setAttribute('aria-pressed',String(on));window.scrollTo(0,0)});
$('#kit').addEventListener('click',()=>{if(document.body.classList.contains('film'))$('#film').click();const open=$('#details').hidden;$('#details').hidden=!open;$('#kit').setAttribute('aria-expanded',String(open));if(open)$('#details').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})});

</script></body></html>
